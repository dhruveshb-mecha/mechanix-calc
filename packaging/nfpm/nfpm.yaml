name: mechanix-calculator
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Minesh Purohit <mineshp@mechasystems.com>"
description: Mechanix Calculator application
homepage: https://github.com/mecha-org/mechanix-calc.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.1
      - mechanix-flutter-engine-data = 3.47.1
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.1)"
      - "mechanix-flutter-engine-data (= 3.47.1)"

contents:
  - src: ./stage/bundle/mechanix_calculator
    dst: /usr/share/mechanix/mechanix-calculator/mechanix_calculator
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-calculator/lib/libapp.so
  - src: ./stage/bundle/lib/libmechanix_common_plugin.so
    dst: /usr/share/mechanix/mechanix-calculator/lib/libmechanix_common_plugin.so    
  - src: ./stage/bundle/data/flutter_assets
    dst: /usr/share/mechanix/mechanix-calculator/data/flutter_assets
  - src: /usr/share/mechanix/flutter/icudtl.dat
    dst: /usr/share/mechanix/mechanix-calculator/data/icudtl.dat
    type: symlink
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_calculator
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
